# Dev environment only: runs the SvelteKit dev server in a bun container with
# hot reload. The project directory is mounted into the container, so edits on
# the host are picked up immediately and `local.db` stays on the host.
#
#   docker compose up                          # http://localhost:5173
#   docker compose exec app bun run db:push    # create the tables (once, while up)
#   docker compose exec app bun run db:seed    # load data/*.csv (~15 s)
#   docker compose exec app bun run test       # unit tests
#   docker compose down -v                     # stop and drop the node_modules volume
#
# Works without a .env (dev fallbacks below); `cp .env.example .env` to set a
# real BETTER_AUTH_SECRET, ADMIN_EMAILS and the AI provider. Ollama on the host
# is reached as http://host.docker.internal:11434 (see OLLAMA_URL below) —
# 127.0.0.1 inside the container is the container itself.
services:
  app:
    image: oven/bun:1
    working_dir: /app
    # bun install on every start keeps the container's node_modules in sync
    # with bun.lock without touching the host's.
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0"
    ports:
      - '5177:5173'
    extra_hosts:
      # Lets the container reach services on the host (Ollama) on Linux too;
      # already resolvable on Docker Desktop.
      - 'host.docker.internal:host-gateway'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      # Resolved from .env when set, dev fallbacks otherwise. environment wins
      # over env_file, and both read the same .env, so real values still apply.
      DATABASE_URL: ${DATABASE_URL:-file:local.db}
      ORIGIN: ${ORIGIN:-http://localhost:5173}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-not-for-prod}
      # .env.example points at 127.0.0.1, which is wrong from inside Docker —
      # use host.docker.internal there to reach an Ollama running on the host.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}

volumes:
  node_modules:
